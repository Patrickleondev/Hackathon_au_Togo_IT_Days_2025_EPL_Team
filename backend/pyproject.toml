[project]
name = "guardian-backend"
version = "2.0.0"
description = "GuardIAn central API — FastAPI + ML detector + RQ worker"
requires-python = ">=3.11"
authors = [{ name = "EPL Team" }]
license = { text = "MIT" }

dependencies = [
    # Web framework
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "python-multipart==0.0.20",

    # Database
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "psycopg[binary]==3.2.3",
    "asyncpg==0.30.0",

    # Cache / queue
    "redis==5.2.1",
    "rq==2.1.0",

    # Security
    "passlib[bcrypt]==1.7.4",
    "python-jose[cryptography]==3.3.0",
    "cryptography==43.0.3",

    # ML
    "scikit-learn==1.5.2",
    "numpy==2.1.3",
    "joblib==1.4.2",

    # System / heuristics
    "psutil==6.1.0",
    "yara-python==4.5.1; platform_system != 'Windows'",
    "python-magic==0.4.27; platform_system != 'Windows'",
    "python-magic-bin==0.4.14; platform_system == 'Windows'",

    # Infra
    "httpx==0.28.1",
    "tenacity==9.0.0",
    "structlog==24.4.0",
    "apscheduler==3.10.4",
    "python-dateutil==2.9.0.post0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "pytest-cov==6.0.0",
    "ruff==0.8.4",
    "mypy==1.13.0",
    "httpx==0.28.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]
ignore = ["S101", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
